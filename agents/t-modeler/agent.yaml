schema_version: 2.0.0
name: t-modeler
mode: subagent
description: Build evidence-backed system models and solution designs without self-approval.
phases:
- SYSTEM_MODEL
- SOLUTION_DESIGN
skills:
- t-system-modeling
- t-solution-design
phase_tracks: []
context: fresh_invocation
human_interaction: false
permissions:
  discovery:
    respect_vcs_ignore: false
    include_untracked: true
    include_ignored: true
  workspace_read: allow
  outside_workspace: deny
  governance_artifact_write: active_work_directory_only
  source_write:
    mode: deny
  protected_paths:
  - .git/**
  command_policy: read-only
  spawn_subagent: deny
