schema_version: 2.0.0
name: t-planner
mode: subagent
description: Produce strategy and executable-checklist tracks of the implementation blueprint.
phases:
- IMPLEMENTATION_BLUEPRINT
skills:
- t-implementation-planning
- t-checklist-builder
phase_tracks:
- phase: IMPLEMENTATION_BLUEPRINT
  track: strategy
  skill: t-implementation-planning
- phase: IMPLEMENTATION_BLUEPRINT
  track: execution_checklist
  skill: t-checklist-builder
context: fresh_invocation
human_interaction: false
permissions:
  discovery:
    respect_vcs_ignore: false
    include_untracked: true
    include_ignored: true
  workspace_read: allow
  outside_workspace: deny
  governance_artifact_write: active_work_directory_only
  source_write:
    mode: deny
  protected_paths:
  - .git/**
  command_policy: read-only
  spawn_subagent: deny
