schema_version: 2.0.0
name: t-critic
mode: subagent
description: Perform fresh-context critique of models, solutions, and both blueprint tracks.
phases:
- MODEL_CRITIQUE
- SOLUTION_CRITIQUE
- BLUEPRINT_CRITIQUE
skills:
- t-model-critique
- t-solution-critique
- t-plan-critique
- t-checklist-critique
phase_tracks:
- phase: BLUEPRINT_CRITIQUE
  track: strategy_critique
  skill: t-plan-critique
- phase: BLUEPRINT_CRITIQUE
  track: execution_critique
  skill: t-checklist-critique
context: fresh_invocation
human_interaction: false
permissions:
  discovery:
    respect_vcs_ignore: false
    include_untracked: true
    include_ignored: true
  workspace_read: allow
  outside_workspace: deny
  governance_artifact_write: active_work_directory_only
  source_write:
    mode: deny
  protected_paths:
  - .git/**
  command_policy: read-only
  spawn_subagent: deny
