behavior_commitments:
  target_behavior: Equivalent requests carrying the same business intent converge
    on one committed outbox row and one business result.
  preserved_behavior:
  - Existing approval API shape
  - Atomic approval-state and outbox persistence
  intentionally_changed_behavior:
  - The second equivalent durable insert is rejected or resolved to the existing result.
  failure_semantics: A conflicting equivalent request returns the same business outcome;
    a conflicting non-equivalent payload for the same key fails explicitly as an idempotency
    conflict.
  transaction_semantics: The unique check and outbox write execute in the existing
    transaction; a uniqueness conflict is converted into a read of the already committed
    or concurrently committed business result.
  concurrency_semantics: Database uniqueness is the final serialization point across
    processes and nodes.
change_surface:
  components:
  - ApprovalService
  - ApprovalRepository
  - approval_outbox schema
  files_or_artifacts:
  - ApprovalService.java
  - approval repository mapping
  - database migration
  public_contract_changes: []
  data_changes:
  - Add idempotency_key column and unique constraint
  configuration_changes: []
  dependencies: []
semantic_constraints:
- The database uniqueness boundary remains the final cross-node serialization point.
- Equivalent retries must converge on one committed durable effect.
planning_constraints:
- Use expand-migrate-contract and do not activate strict enforcement before old writers
  are isolated or upgraded.
- Planning may decompose work but may not change solution semantics.
prohibited_changes:
- No new public API contract, fallback, retry behavior, state machine, dependency,
  or persistence strategy without returning to Solution Design.
