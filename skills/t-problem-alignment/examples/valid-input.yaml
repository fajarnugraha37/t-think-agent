human_problem_statement:
  raw_text: >-
    Ketika pengguna menekan approve order dan request mengalami timeout,
    pengguna kadang mengulang request dan downstream menerima efek approval
    lebih dari sekali. Saya ingin problemnya dipahami dulu tanpa menentukan
    solusi atau root cause.
  business_context: Approval order memicu proses downstream yang tidak boleh terduplikasi.
  urgency: HIGH

explicit_statements:
  - id: HS-001
    statement: Pengguna dapat mengulang request setelah menerima timeout.
    source: HUMAN
    material: true
  - id: HS-002
    statement: Satu intent approval order harus menghasilkan satu durable business effect.
    source: HUMAN
    material: true
  - id: HS-003
    statement: Fase ini tidak boleh menentukan root cause atau solusi.
    source: HUMAN
    material: true

known_constraints:
  - id: CST-001
    statement: Existing public API compatibility harus dipertahankan kecuali disetujui kemudian.
    type: COMPATIBILITY

initial_scope:
