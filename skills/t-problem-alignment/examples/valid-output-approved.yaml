    why_it_matters: Identitas intent diperlukan untuk menyatakan expected behavior dan acceptance signal.
    answer_statement_id: HS-008
  - id: Q-002
    question: Komponen mana yang pertama menerima approval command?
    classification: DEFER_TO_INVESTIGATION
    status: OPEN
