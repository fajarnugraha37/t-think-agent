source_input:
  request_id: REQ-ORDER-DUPLICATE-001
  input_digest: sha256:example

normalized_problem:
  problem_statement: >-
    Ketika satu approval command untuk order yang sama menerima timeout dan
    dikirim ulang dengan business operation identifier yang sama, sistem dapat
    menghasilkan lebih dari satu durable business effect, padahal satu business
    operation identifier harus merepresentasikan tepat satu intent approval.
  observed_behavior:
    - statement: Pengguna dapat mengirim ulang approval command setelah timeout.
      source_statement_ids: [HS-001]
    - statement: Downstream dapat menerima lebih dari satu durable business effect untuk business operation identifier yang sama.
      source_statement_ids: [HS-004]
  expected_behavior:
    - statement: Satu business operation identifier merepresentasikan satu intent approval.
      source_statement_ids: [HS-008]
    - statement: Satu intent approval menghasilkan tepat satu durable business effect.
      source_statement_ids: [HS-002]
  impact:
    - statement: Duplikasi durable business effect dapat memproses approval lebih dari sekali di downstream.
      source_statement_ids: [HS-004]
  success_definition:
    - statement: Pengulangan approval command dengan business operation identifier yang sama tidak menghasilkan durable business effect tambahan.
      source_statement_ids: [HS-008, HS-002]

human_statements:
  - id: HS-001
    statement: Pengguna dapat mengulang request setelah menerima timeout.
    source: INITIAL_INPUT
    confirmed: true
    material: true
