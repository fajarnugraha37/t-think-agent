interpretations:
  - id: INT-001
    original_statement_id: HS-002
    normalized_interpretation: >-
      “Satu durable business effect” berarti keseluruhan hasil bisnis persisten
      untuk satu intent, bukan sekadar satu HTTP response.
    reason: Istilah perlu dibedakan dari jumlah request atau response.
    confidence: HIGH
    material: true
    human_confirmation: CONFIRMED

terms:
  - id: TERM-001
    term: durable business effect
    definition: Perubahan bisnis persisten atau side effect downstream yang dianggap satu hasil approval.
    confirmation: CONFIRMED
    source_statement_ids: [HS-002]
  - id: TERM-002
    term: business operation identifier
    definition: Identifier yang sama menunjukkan intent approval bisnis yang sama walaupun request dikirim ulang.
    confirmation: CONFIRMED
    source_statement_ids: [HS-008]

constraints:
