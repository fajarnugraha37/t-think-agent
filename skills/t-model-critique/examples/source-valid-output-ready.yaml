  limitations:
  - Production gateway and deployed database schema were not inspected.
model_summary:
  statement: The inspected producer flow delegates approval requests to a transactional
    service that writes a durable outbox record; no inspected uniqueness guard prevents
    an equivalent second request from committing another row.
  actual_behavior_summary: Equivalent requests can independently reach durable outbox
    insertion in the inspected path.
  intended_behavior_summary: One business approval intent should result in at most
    one committed approval outbox row.
  gap_summary: The inspected path does not evidence enforcement of the intended one-intent-to-one-row
    cardinality.
  leading_explanation: Duplicate durable events are explained by equivalent executions
    reaching the outbox insert without an inspected uniqueness or serialization guard.
  alternative_explanations:
  - A production-only gateway may serialize requests.
  - A deployed database constraint may differ from repository migrations.
  - Downstream consumers may deduplicate even when producer records duplicate.
  confidence: MEDIUM
