source_artifacts:
  model_critique_output: {path: artifacts/04g-model-critique-output.yaml, digest: sha256:modelcritique}
  model_elements: {path: artifacts/03a-model-elements.jsonl, digest: sha256:elements}
  model_relations: {path: artifacts/03b-model-relations.jsonl, digest: sha256:relations}
