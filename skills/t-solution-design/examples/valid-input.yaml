design_scope:
  included: [Approval request producer flow, Approval outbox persistence]
  excluded: [Downstream consumer implementation]
  non_goals: [Redesign the entire event platform]
  constraints: [Preserve the public approval API, Preserve one transaction for approval state and outbox persistence]
  prohibited_changes: [Do not allow duplicate durable approval effects, Do not rely on undocumented production infrastructure]
  accepted_residual_uncertainties: [Production gateway and deployed schema remain outside inspected scope.]
design_targets:
  - target_id: TGT-001
    target_type: BEHAVIOR_GAP
    source_ids: [MDL-011]
    statement: Prevent equivalent approval intents from committing duplicate durable outbox effects.
    required_coverage: FULL
  - target_id: TGT-002
    target_type: INVARIANT
    source_ids: [MDL-010, INV-001]
    statement: Preserve the invariant that one business approval intent produces at most one committed approval outbox row.
    required_coverage: FULL
  - target_id: TGT-003
    target_type: COMPATIBILITY
    source_ids: [PS-001]
    statement: Preserve the existing public approval request and response contract.
    required_coverage: FULL
option_policy:
  minimum_viable_options: 2
  allow_single_viable_option: true
  require_dominance_proof_for_single: true
  require_material_distinctness: true
  comparison_criteria: [CORRECTNESS, INVARIANT_PRESERVATION, COMPATIBILITY, FAILURE_SEMANTICS, MIGRATION, REVERSIBILITY, OPERABILITY, COMPLEXITY]
decision_authority:
  binding_authority: HUMAN
  agent_may_recommend: true
  agent_may_approve: false
