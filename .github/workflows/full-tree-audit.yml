name: Temporary full tree audit

on:
  push:
    branches:
      - cleanup/remove-generated-artifacts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory and classify repository tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          git ls-files -z | sort -z | tr '\0' '\n' > audit-output/tracked-files.txt
          find . -type f -not -path './.git/*' -printf '%P\n' | sort > audit-output/worktree-files.txt
          {
            echo '# Suspicious tracked paths'
            git ls-files | grep -Ei '(^|/)(__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|node_modules|dist|build|target|coverage|\.coverage|\.idea|\.vscode)(/|$)|(^|/)(\.DS_Store|Thumbs\.db)$|\.(pyc|pyo|class|log|tmp|temp|orig|rej|swp|swo|zip|tar|tar\.gz|tgz)$|\.bak(-|\.|$)|~$' || true
            echo
            echo '# Generated or report-like tracked paths'
            git ls-files | grep -Ei '(^|/)(reports?|archives?|artifacts?|generated|output|outputs)(/|$)|CHECKSUMS\.sha256$|RESOURCE_INDEX\.md$' || true
          } > audit-output/candidates.txt
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import hashlib, json
          files=[]
          by_hash=defaultdict(list)
          for line in Path('audit-output/tracked-files.txt').read_text().splitlines():
              p=Path(line)
              if not p.is_file():
                  continue
              data=p.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              by_hash[sha].append(line)
              files.append({'path':line,'size':len(data),'sha256':sha})
          duplicates=[{'sha256':h,'size':next(x['size'] for x in files if x['sha256']==h),'paths':paths} for h,paths in by_hash.items() if len(paths)>1]
          Path('audit-output/inventory.json').write_text(json.dumps({'file_count':len(files),'files':files,'duplicate_groups':duplicates},indent=2)+'\n')
          with Path('audit-output/duplicates.txt').open('w') as out:
              for group in sorted(duplicates,key=lambda g:(-g['size'],g['paths'])):
                  out.write(f"{group['sha256']} size={group['size']}\n")
                  out.writelines(f"  {p}\n" for p in group['paths'])
          PY
          git status --short > audit-output/git-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full-tree-audit
          path: audit-output/
          if-no-files-found: error
