schema_version: 1.1.0
policy: workspace-and-permission-boundaries
principles:
  vcs_ignore: Controls default discovery only; it is not a confidentiality, authorization, or write boundary.
  workspace_read: Normal tracked and untracked repository content may be read when relevant.
  ignored_file_access: Allowed without approval for paths inside the active project worktree.
  source_write: Only t-builder, only during BOUNDED_IMPLEMENTATION, only to approved checklist targets.
  governance_artifacts: All roles may write governance artifacts only below the exact active .t-think/<work-id>
    directory declared by the delegation packet.
  generated_outputs: t-verifier may create only declared build/test/report outputs; never source changes.
  outside_workspace: Denied for every subagent.
  temporary_files: Temporary diagnostic files are allowed only below the active work scratch directory and must
    be deleted before reconciliation.
  durable_tests: Reusable behavior and regression checks must be implemented as permanent repository tests through
    bounded implementation.
discovery_defaults:
  respect_vcs_ignore: false
  include_untracked: true
  include_ignored: true
protected_paths:
- .git/**
approved_write_target_source:
  authoritative_artifact: human-approved implementation checklist contract
  require_exact_or_declared_glob_match: true
  empty_means: no source writes permitted
generated_output_examples:
- target/**
- build/**
- reports/**
- .t-think/<work-id>/scratch/**
active_work_directory:
  pattern: .t-think/<work-id>
  delegation_field: workspace.active_work_directory
  governance_write_pattern: .t-think/<work-id>/**
  broad_root_write_forbidden: true
work_directory_layout:
  allowed_files:
  - state.yaml
  allowed_directories:
  - artifacts
  - delegations
  - results
  - boundary-reports
  - evidence
  - scratch
  - session
  scratch_must_be_empty_before:
  - RECONCILIATION
  - COMPLETED
