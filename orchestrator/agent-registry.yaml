schema_version: 2.1.0
suite: t-think
topology: star
max_delegation_depth: 1
orchestrator:
  name: t-think
  mode: primary
  human_interaction: true
  source_write: deny
  may_delegate_to:
  - t-investigator
  - t-modeler
  - t-planner
  - t-critic
  - t-builder
  - t-reviewer
  - t-security-reviewer
  - t-breaking-reviewer
  - t-verifier
  - t-reconciler
agents:
- schema_version: 2.0.0
  name: t-investigator
  mode: subagent
  description: Collect repository and runtime evidence without proposing or implementing a solution.
  phases:
  - INVESTIGATION
  skills:
  - t-investigation
  phase_tracks: []
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: &id001
    - .git/**
    command_policy: diagnostic-read-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-modeler
  mode: subagent
  description: Build evidence-backed system models and solution designs without self-approval.
  phases:
  - SYSTEM_MODEL
  - SOLUTION_DESIGN
  skills:
  - t-system-modeling
  - t-solution-design
  phase_tracks: []
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: read-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-planner
  mode: subagent
  description: Produce strategy and executable-checklist tracks of the implementation blueprint.
  phases:
  - IMPLEMENTATION_BLUEPRINT
  skills:
  - t-implementation-planning
  - t-checklist-builder
  phase_tracks:
  - phase: IMPLEMENTATION_BLUEPRINT
    track: strategy
    skill: t-implementation-planning
  - phase: IMPLEMENTATION_BLUEPRINT
    track: execution_checklist
    skill: t-checklist-builder
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: read-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-critic
  mode: subagent
  description: Perform fresh-context critique of models, solutions, and both blueprint tracks.
  phases:
  - MODEL_CRITIQUE
  - SOLUTION_CRITIQUE
  - BLUEPRINT_CRITIQUE
  skills:
  - t-model-critique
  - t-solution-critique
  - t-plan-critique
  - t-checklist-critique
  phase_tracks:
  - phase: BLUEPRINT_CRITIQUE
    track: strategy_critique
    skill: t-plan-critique
  - phase: BLUEPRINT_CRITIQUE
    track: execution_critique
    skill: t-checklist-critique
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: read-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-builder
  mode: subagent
  description: Execute authorized blueprint tasks and perform a fresh self-review track.
  phases:
  - BOUNDED_IMPLEMENTATION
  - IMPLEMENTATION_REVIEW
  skills:
  - t-bounded-implementation
  - t-self-review
  phase_tracks:
  - phase: IMPLEMENTATION_REVIEW
    track: self_review
    skill: t-self-review
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: approved_targets_only
    protected_paths: *id001
    command_policy: approved-blueprint-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-reviewer
  mode: subagent
  description: Independently review implementation correctness in a fresh read-only context.
  phases:
  - IMPLEMENTATION_REVIEW
  skills:
  - t-technical-review
  phase_tracks:
  - phase: IMPLEMENTATION_REVIEW
    track: technical_review
    skill: t-technical-review
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: read-only-checks
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-security-reviewer
  mode: subagent
  description: Perform a dedicated security review of the actual change without source edits.
  phases:
  - IMPLEMENTATION_REVIEW
  skills:
  - t-security-review
  phase_tracks:
  - phase: IMPLEMENTATION_REVIEW
    track: security_review
    skill: t-security-review
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: security-read-only-checks
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-breaking-reviewer
  mode: subagent
  description: Detect breaking changes in flow, rules, validation, structures, mappings, contracts, and operations.
  phases:
  - IMPLEMENTATION_REVIEW
  skills:
  - t-breaking-review
  phase_tracks:
  - phase: IMPLEMENTATION_REVIEW
    track: breaking_review
    skill: t-breaking-review
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: compatibility-read-only-checks
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-verifier
  mode: subagent
  description: Execute approved reproducible verification without changing source code.
  phases:
  - VERIFICATION
  skills:
  - t-verification
  phase_tracks: []
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: generated_outputs_only
    protected_paths: *id001
    command_policy: approved-verification-only
    spawn_subagent: deny
- schema_version: 2.0.0
  name: t-reconciler
  mode: subagent
  description: Audit end-to-end traceability and unresolved findings before final closure.
  phases:
  - RECONCILIATION
  skills:
  - t-reconciliation
  phase_tracks: []
  context: fresh_invocation
  human_interaction: false
  permissions:
    discovery:
      respect_vcs_ignore: false
      include_untracked: true
      include_ignored: true
    workspace_read: allow
    outside_workspace: deny
    governance_artifact_write: active_work_directory_only
    source_write:
      mode: deny
    protected_paths: *id001
    command_policy: read-only
    spawn_subagent: deny
