version: 2.0.0
name: governed-agentic-software-delivery-lifecycle
canonical_states:
- PROBLEM_ALIGNMENT
- INVESTIGATION
- SYSTEM_MODEL
- MODEL_CRITIQUE
- SOLUTION_DESIGN
- SOLUTION_CRITIQUE
- IMPLEMENTATION_BLUEPRINT
- BLUEPRINT_CRITIQUE
- BOUNDED_IMPLEMENTATION
- IMPLEMENTATION_REVIEW
- VERIFICATION
- RECONCILIATION
- COMPLETED
terminal_states:
- COMPLETED
- REJECTED
external_holds:
- HUMAN_DECISION
- ACCESS_REQUIRED
success_path:
- skill: problem-alignment
  directory: skills/t-problem-alignment
  state: PROBLEM_ALIGNMENT
  success_gate: READY_FOR_INVESTIGATION
  next_state: INVESTIGATION
  human_gate: true
  composite: false
- skill: investigation
  directory: skills/t-investigation
  state: INVESTIGATION
  success_gate: READY_FOR_SYSTEM_MODEL
  next_state: SYSTEM_MODEL
  human_gate: false
  composite: false
- skill: system-modeling
  directory: skills/t-system-modeling
  state: SYSTEM_MODEL
  success_gate: READY_FOR_MODEL_CRITIQUE
  next_state: MODEL_CRITIQUE
  human_gate: false
  composite: false
- skill: model-critique
  directory: skills/t-model-critique
  state: MODEL_CRITIQUE
  success_gate: READY_FOR_SOLUTION_DESIGN
  next_state: SOLUTION_DESIGN
  human_gate: false
  composite: false
- skill: solution-design
  directory: skills/t-solution-design
  state: SOLUTION_DESIGN
  success_gate: READY_FOR_SOLUTION_CRITIQUE
  next_state: SOLUTION_CRITIQUE
  human_gate: false
  composite: false
- skill: solution-critique
  directory: skills/t-solution-critique
  state: SOLUTION_CRITIQUE
  success_gate: READY_FOR_IMPLEMENTATION_BLUEPRINT
  next_state: IMPLEMENTATION_BLUEPRINT
  human_gate: true
  composite: false
- skill: implementation-blueprint
  directory: skills/t-implementation-blueprint
  state: IMPLEMENTATION_BLUEPRINT
  success_gate: READY_FOR_BLUEPRINT_CRITIQUE
  next_state: BLUEPRINT_CRITIQUE
  human_gate: false
  composite: true
- skill: blueprint-critique
  directory: skills/t-blueprint-critique
  state: BLUEPRINT_CRITIQUE
  success_gate: READY_FOR_BOUNDED_IMPLEMENTATION
  next_state: BOUNDED_IMPLEMENTATION
  human_gate: true
  composite: true
- skill: bounded-implementation
  directory: skills/t-bounded-implementation
  state: BOUNDED_IMPLEMENTATION
  success_gate: READY_FOR_IMPLEMENTATION_REVIEW
  next_state: IMPLEMENTATION_REVIEW
  human_gate: false
  composite: false
- skill: implementation-review
  directory: skills/t-implementation-review
  state: IMPLEMENTATION_REVIEW
  success_gate: READY_FOR_VERIFICATION
  next_state: VERIFICATION
  human_gate: false
  composite: true
- skill: verification
  directory: skills/t-verification
  state: VERIFICATION
  success_gate: READY_FOR_RECONCILIATION
  next_state: RECONCILIATION
  human_gate: false
  composite: false
- skill: reconciliation
  directory: skills/t-reconciliation
  state: RECONCILIATION
  success_gate: RECONCILED_COMPLETE
  next_state: COMPLETED
  human_gate: true
  composite: false
loopback_rule:
  policy: Route to the earliest canonical lifecycle phase that owns the invalidated decision or missing evidence.
  no_silent_repair: true
  preserve_superseded_artifacts: true
  require_new_version_or_run_id: true
mutation_boundaries:
  read_only_states:
  - PROBLEM_ALIGNMENT
  - INVESTIGATION
  - SYSTEM_MODEL
  - MODEL_CRITIQUE
  - SOLUTION_DESIGN
  - SOLUTION_CRITIQUE
  - IMPLEMENTATION_BLUEPRINT
  - BLUEPRINT_CRITIQUE
  - IMPLEMENTATION_REVIEW
  - VERIFICATION
  - RECONCILIATION
  repository_mutation_state: BOUNDED_IMPLEMENTATION
  remediation_during_review_allowed: false
