version: 2.3.1
topology: star
max_delegation_depth: 1
human_owner:
  exclusive_authority:
  - semantic approval
  - risk acceptance
  - execution authorization
  - final closure approval
orchestrator:
  agent: t-think
  responsibilities:
  - enforce lane-aware lifecycle and gates
  - orchestrate composite phases and aggregate track results
  - create and validate delegation packets
  - preserve artifact lineage and digests
  - route loopbacks to earliest canonical owner
  - prevent hidden delegation
  source_write: deny
phase_roles:
  INVESTIGATION: t-investigator
  SYSTEM_MODEL: t-modeler
  MODEL_CRITIQUE: t-critic
  SOLUTION_DESIGN: t-modeler
  SOLUTION_CRITIQUE: t-critic
  BOUNDED_IMPLEMENTATION: t-builder
  VERIFICATION: t-verifier
  RECONCILIATION: t-reconciler
composite_track_roles:
  IMPLEMENTATION_BLUEPRINT:
    strategy: t-planner
    execution_checklist: t-planner
  BLUEPRINT_CRITIQUE:
    strategy_critique: t-critic
    execution_critique: t-critic
  IMPLEMENTATION_REVIEW:
    self_review: t-builder
    technical_review: t-reviewer
    security_review: t-security-reviewer
    breaking_review: t-breaking-reviewer
independence:
  self_review: fresh t-builder invocation with source mutation disabled
  technical_review: fresh t-reviewer context without private builder reasoning
  security_review: dedicated t-security-reviewer in standard and full
  breaking_review: dedicated t-breaking-reviewer in standard and full
  verification: t-verifier is independent from every review track
  reconciliation: t-reconciler is independent from execution and review
