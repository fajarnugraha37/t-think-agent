schema_version: 1.0.0
purpose: Map globally installed t-* skill names to immutable artifact contract identifiers
  used by validated schemas and fixture digests.
rules:
- Use installed_skill for discovery and invocation.
- Use contract_id only in schema fields that explicitly require it.
- Do not rewrite contract_id values in approved artifacts; they are digest-bound identifiers,
  not legacy install names.
mappings:
- installed_skill: t-problem-alignment
  contract_id: problem-alignment-skill
- installed_skill: t-investigation
  contract_id: investigation-skill
- installed_skill: t-system-modeling
