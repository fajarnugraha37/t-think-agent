schema_version: 1.1.0
topology: star
parent: t-think
max_depth: 1
rules:
- Only t-think may create delegation packets.
- Subagents may not invoke other subagents.
- Exactly one lifecycle phase and one active skill are permitted per invocation.
- Every invocation uses a fresh context except continuity is carried by digest-bound artifacts.
- The selected governance lane, artifact mode, and expected next state are included in every v2.3 delegation packet.
- A phase waived by the selected lane may not be delegated unless the lane is promoted.
- The result is advisory until schema, semantic, digest, lane-transition, and boundary validation pass.
- Only t-think transitions lifecycle state.
required_packet_sections:
- identity
- lifecycle
- objective
- workspace
- permissions
- artifact_inputs
- output_contract
- stop_conditions
retry_policy:
  schema_failure: one constrained retry with validator errors
  semantic_incompleteness: one constrained retry with missing completion criteria
  second_failure: return control to t-think without transition
  boundary_violation: invalidate immediately; no automatic retry
  lane_mismatch: stop and request monotonic lane promotion
